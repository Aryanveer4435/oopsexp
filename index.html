<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpVault - OOPs Experiments Repository</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'Fira Code', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-cyan-500 to-blue-600 p-2 rounded-xl text-white shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-code text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">ExpVault</h1>
                    <p class="text-xs text-slate-400">Object-Oriented Programming Experiments</p>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <!-- Search Bar -->
                <div class="relative hidden sm:block">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-search text-sm"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search experiments..." class="bg-slate-800 text-sm text-slate-200 pl-9 pr-4 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-cyan-500 w-64 transition-all">
                </div>

                <!-- Admin Action Button -->
                <div id="adminActionContainer">
                    <button id="authBtn" onclick="toggleAuth()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-sm px-4 py-2 rounded-lg border border-slate-700 flex items-center space-x-2 transition-all">
                        <i class="fa-solid fa-shield-halved text-cyan-400"></i>
                        <span id="authBtnText">Admin Sign In</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        <!-- Controls & Category Filters -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div id="categoryFilters" class="flex flex-wrap gap-2">
                <button onclick="filterCategory('All')" class="cat-btn active px-4 py-1.5 rounded-lg text-sm font-medium bg-cyan-500 text-white transition-all shadow-md shadow-cyan-500/20">All Experiments</button>
                <button onclick="filterCategory('Java')" class="cat-btn px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-slate-800 transition-all">Java</button>
                <button onclick="filterCategory('C++')" class="cat-btn px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-slate-800 transition-all">C++</button>
                <button onclick="filterCategory('Python')" class="cat-btn px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-slate-800 transition-all">Python</button>
            </div>

            <!-- Add New Experiment Button (Hidden for public visitors, unlocked for admin) -->
            <div id="addNewContainer" class="hidden">
                <button onclick="openModal()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-lg shadow-cyan-500/20 flex items-center space-x-2 transition-all">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Experiment</span>
                </button>
            </div>
        </div>

        <!-- Experiments Grid -->
        <div id="experimentsGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Dynamic Cards Will Load Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="text-slate-600 text-5xl mb-4"><i class="fa-solid fa-folder-open"></i></div>
            <h3 class="text-lg font-medium text-slate-300">No experiments found</h3>
            <p class="text-sm text-slate-500 mt-1">Try adjusting your search or category filter.</p>
        </div>
    </main>

    <!-- Add/Edit Modal (Admin Only) -->
    <div id="expModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                <h3 id="modalTitle" class="font-semibold text-slate-200">Add New OOP Experiment</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="expForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="expId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Experiment Title</label>
                        <input type="text" id="expTitle" required placeholder="e.g., Dynamic Method Dispatch" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Language / Category</label>
                        <select id="expCategory" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="Java">Java</option>
                            <option value="C++">C++</option>
                            <option value="Python">Python</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Description / Objective</label>
                    <textarea id="expDesc" rows="2" required placeholder="Brief explanation of the OOP concept demonstrated..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 custom-scrollbar"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Source Code</label>
                    <textarea id="expCode" rows="8" required placeholder="Paste your code here..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 font-mono focus:outline-none focus:border-cyan-500 custom-scrollbar"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Output / Execution Result</label>
                    <textarea id="expOutput" rows="3" required placeholder="Paste terminal output..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 font-mono focus:outline-none focus:border-cyan-500 custom-scrollbar"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-white bg-slate-800">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-lg text-sm font-medium bg-cyan-500 hover:bg-cyan-400 text-white shadow-lg shadow-cyan-500/20">Save Experiment</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p>ExpVault &copy; 2026 &bull; Secure OOPs Experiment Repository</p>
    </footer>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjd3umg3pVKhT2lSeqOPcuo5pa8AfM7Pc",
            authDomain: "oopsexp.firebaseapp.com",
            projectId: "oopsexp",
            storageBucket: "oopsexp.firebasestorage.app",
            messagingSenderId: "299122521880",
            appId: "1:299122521880:web:96bff4a8a95ed97d6d906d",
            measurementId: "G-JRMVNJ3CSF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let experiments = [];
        let currentCategory = 'All';
        let isAdmin = false;

        // Admin email check (Change this to your actual email if needed)
        const ADMIN_EMAIL = "aryanveer5344@gmail.com";

        // Expose functions globally
        window.toggleAuth = async () => {
            if (isAdmin) {
                await signOut(auth);
            } else {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error("Auth error:", error);
                    alert("Authentication failed: " + error.message);
                }
            }
        };

        window.openModal = (id = null) => {
            if (!isAdmin) return;
            const modal = document.getElementById('expModal');
            const title = document.getElementById('modalTitle');
            document.getElementById('expForm').reset();
            document.getElementById('expId').value = '';
            
            if (id) {
                title.innerText = "Edit Experiment";
                const exp = experiments.find(e => e.id === id);
                if (exp) {
                    document.getElementById('expId').value = exp.id;
                    document.getElementById('expTitle').value = exp.title;
                    document.getElementById('expCategory').value = exp.category;
                    document.getElementById('expDesc').value = exp.description;
                    document.getElementById('expCode').value = exp.code;
                    document.getElementById('expOutput').value = exp.output || '';
                }
            } else {
                title.innerText = "Add New OOP Experiment";
            }
            modal.classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('expModal').classList.add('hidden');
        };

        window.filterCategory = (cat) => {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === 'All' && btn.innerText.includes('All'))) {
                    btn.className = "cat-btn active px-4 py-1.5 rounded-lg text-sm font-medium bg-cyan-500 text-white transition-all shadow-md shadow-cyan-500/20";
                } else {
                    btn.className = "cat-btn px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-slate-800 transition-all";
                }
            });
            renderExperiments();
        };

        window.copyCode = (buttonElement) => {
            const codeBox = buttonElement.closest('.bg-slate-900').querySelector('code');
            navigator.clipboard.writeText(codeBox.innerText);
            const originalHTML = buttonElement.innerHTML;
            buttonElement.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i><span class="text-emerald-400">Copied!</span>';
            setTimeout(() => {
                buttonElement.innerHTML = originalHTML;
            }, 2000);
        };

        window.deleteExperiment = async (id) => {
            if (!isAdmin) return;
            if (confirm("Are you sure you want to delete this experiment?")) {
                try {
                    await deleteDoc(doc(db, "experiments", id));
                    fetchExperiments();
                } catch (error) {
                    console.error("Error deleting:", error);
                    alert("Error deleting experiment.");
                }
            }
        };

        window.editExperiment = (id) => {
            openModal(id);
        };

        window.handleFormSubmit = async (e) => {
            e.preventDefault();
            if (!isAdmin) return;

            const id = document.getElementById('expId').value;
            const data = {
                title: document.getElementById('expTitle').value,
                category: document.getElementById('expCategory').value,
                description: document.getElementById('expDesc').value,
                code: document.getElementById('expCode').value,
                output: document.getElementById('expOutput').value,
                updatedAt: serverTimestamp()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "experiments", id), data);
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, "experiments"), data);
                }
                closeModal();
                fetchExperiments();
            } catch (error) {
                console.error("Error saving:", error);
                alert("Error saving experiment: " + error.message);
            }
        };

        // Fetch experiments from Firestore
        async function fetchExperiments() {
            try {
                const q = query(collection(db, "experiments"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                experiments = [];
                querySnapshot.forEach((docSnap) => {
                    experiments.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderExperiments();
            } catch (e) {
                console.error("Error fetching experiments:", e);
            }
        }

        function renderExperiments() {
            const grid = document.getElementById('experimentsGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = experiments.filter(exp => {
                const matchesCat = currentCategory === 'All' || exp.category === currentCategory;
                const matchesSearch = exp.title.toLowerCase().includes(searchVal) || exp.description.toLowerCase().includes(searchVal) || exp.code.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            grid.innerHTML = '';
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            filtered.forEach(exp => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden flex flex-col shadow-xl";
                
                const badgeColor = exp.category === 'Java' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                                   exp.category === 'C++' ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

                let adminButtonsHTML = '';
                if (isAdmin) {
                    adminButtonsHTML = `
                        <div class="flex items-center space-x-2">
                            <button onclick="editExperiment('${exp.id}')" class="text-slate-400 hover:text-cyan-400 text-xs px-2 py-1 rounded bg-slate-800"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteExperiment('${exp.id}')" class="text-slate-400 hover:text-rose-400 text-xs px-2 py-1 rounded bg-slate-800"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="p-5 border-b border-slate-800/80 flex items-start justify-between gap-4">
                        <div>
                            <div class="flex items-center space-x-2 mb-2">
                                <span class="text-xs px-2.5 py-0.5 rounded-full border font-medium ${badgeColor}">${exp.category}</span>
                            </div>
                            <h3 class="font-semibold text-slate-100 text-base">${escapeHtml(exp.title)}</h3>
                            <p class="text-xs text-slate-400 mt-1">${escapeHtml(exp.description)}</p>
                        </div>
                        ${adminButtonsHTML}
                    </div>
                    <div class="relative bg-slate-950 p-4 border-b border-slate-800/80 flex-grow">
                        <div class="absolute top-3 right-3 flex items-center space-x-2">
                            <button onclick="copyCode(this)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 flex items-center space-x-1.5 transition-all">
                                <i class="fa-regular fa-copy"></i>
                                <span>Copy</span>
                            </button>
                        </div>
                        <pre class="overflow-x-auto custom-scrollbar pt-8 pb-2"><code class="text-xs text-slate-300 leading-relaxed">${escapeHtml(exp.code)}</code></pre>
                    </div>
                    ${exp.output ? `
                    <div class="bg-slate-900/60 p-4 border-t border-slate-800/80">
                        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5 flex items-center space-x-1">
                            <i class="fa-solid fa-terminal text-cyan-400"></i>
                            <span>Output Display</span>
                        </div>
                        <pre class="bg-slate-950/80 p-3 rounded-lg border border-slate-800/60 overflow-x-auto custom-scrollbar"><code class="text-xs text-emerald-400">${escapeHtml(exp.output)}</code></pre>
                    </div>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Search listener
        document.getElementById('searchInput').addEventListener('input', renderExperiments);

        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            const authBtnText = document.getElementById('authBtnText');
            const authBtn = document.getElementById('authBtn');
            const addNewContainer = document.getElementById('addNewContainer');

            if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                isAdmin = true;
                authBtnText.innerText = "Admin (Sign Out)";
                authBtn.classList.add('border-cyan-500/50', 'text-cyan-400');
                addNewContainer.classList.remove('hidden');
            } else {
                if (user) {
                    signOut(auth);
                    alert("Unauthorized account. Only the admin can sign in.");
                }
                isAdmin = false;
                authBtnText.innerText = "Admin Sign In";
                authBtn.classList.remove('border-cyan-500/50', 'text-cyan-400');
                addNewContainer.classList.add('hidden');
            }
            renderExperiments();
        });

        // Initial Load
        fetchExperiments();
    </script>
</body>
</html>
