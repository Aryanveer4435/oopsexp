<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOPs Manual — Experiments Repository</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1e1b2e; color: #f3f0ff; }
        code, pre { font-family: 'Fira Code', monospace; }
        
        /* Neumorphic Raised Surface */
        .neumorphic-card {
            background: #27223b;
            box-shadow: 10px 10px 25px #14121f, -6px -6px 20px #3a3257, inset 1px 1px 0px rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
        
        /* Neumorphic Inset Surface (for EXP badge, inputs, and code boxes) */
        .neumorphic-inset {
            background: #1e1b2e;
            box-shadow: inset 4px 4px 8px #12101b, inset -4px -4px 8px #2a2641;
            border: 1px solid rgba(167, 139, 250, 0.18);
        }

        /* Neumorphic Raised Circle/Pill Button */
        .neumorphic-btn {
            background: #27223b;
            box-shadow: 5px 5px 12px #14121f, -4px -4px 10px #3a3257;
            border: 1px solid rgba(167, 139, 250, 0.25);
        }
        .neumorphic-btn:hover {
            background: #2f2947;
        }
        .neumorphic-btn:active {
            box-shadow: inset 3px 3px 6px #14121f, inset -3px -3px 6px #3a3257;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e1b2e; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-400 selection:text-slate-950">

    <!-- Floating Pill Navbar (Inspired by your screenshot) -->
    <header class="sticky top-4 z-40 max-w-5xl mx-auto w-full px-4">
        <div class="neumorphic-card rounded-3xl px-5 py-3.5 flex items-center justify-between gap-4">
            <a href="#" id="homeLogoBtn" class="flex items-center space-x-3.5 group">
                <div class="bg-gradient-to-tr from-emerald-400 to-teal-500 w-11 h-11 rounded-2xl flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-code text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-extrabold text-lg tracking-tight text-white">OOPs Manual 🐈</span>
                    </div>
                    <p class="text-[11px] font-semibold uppercase tracking-widest text-emerald-400">Object-Oriented Lab</p>
                </div>
            </a>

            <div class="flex items-center space-x-3">
                <!-- Search Bar -->
                <div class="relative hidden sm:block">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-purple-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search experiments..." class="neumorphic-inset text-xs text-purple-100 pl-9 pr-4 py-2.5 rounded-2xl focus:outline-none focus:border-emerald-400 w-56 transition-all placeholder-purple-400/50">
                </div>

                <!-- Admin Action Button -->
                <div id="adminActionContainer">
                    <button id="authBtn" type="button" class="neumorphic-btn text-purple-200 hover:text-white text-xs font-semibold px-4 py-2.5 rounded-2xl flex items-center space-x-2 transition-all cursor-pointer">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span id="authBtnText">Admin Sign In</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Clean Heading Area -->
    <section id="heroSection" class="max-w-5xl mx-auto px-4 pt-8 pb-2 w-full">
        <div class="neumorphic-card rounded-3xl p-6 flex flex-col items-center justify-center text-center">
            <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">
                Object-Oriented Programming <span class="bg-gradient-to-r from-emerald-300 to-teal-300 bg-clip-text text-transparent">Lab Manual</span>
            </h2>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Controls & Category Filters -->
        <div id="filterBar" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div id="categoryFilters" class="flex flex-wrap gap-2.5">
                <button type="button" data-cat="All" class="cat-btn active px-4 py-2 rounded-2xl text-xs font-bold bg-emerald-400 text-slate-950 transition-all shadow-lg shadow-emerald-400/20 cursor-pointer">All Experiments</button>
                <button type="button" data-cat="Java" class="cat-btn px-4 py-2 rounded-2xl text-xs font-semibold neumorphic-btn text-purple-300 hover:text-white transition-all cursor-pointer">Java</button>
                <button type="button" data-cat="DSA" class="cat-btn px-4 py-2 rounded-2xl text-xs font-semibold neumorphic-btn text-purple-300 hover:text-white transition-all cursor-pointer">DSA</button>
                <button type="button" data-cat="Python" class="cat-btn px-4 py-2 rounded-2xl text-xs font-semibold neumorphic-btn text-purple-300 hover:text-white transition-all cursor-pointer">Python</button>
            </div>

            <!-- Add New Experiment Button -->
            <div id="addNewContainer" class="hidden">
                <button id="addExpBtn" type="button" class="bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-bold text-xs px-5 py-2.5 rounded-2xl shadow-lg shadow-emerald-400/20 flex items-center space-x-2 transition-all cursor-pointer">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Experiment</span>
                </button>
            </div>
        </div>

        <!-- Horizontal Experiment Tabs List -->
        <div id="experimentsList" class="space-y-5">
            <!-- Dynamic Horizontal Tab Cards Will Load Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="text-purple-400/50 text-6xl mb-4">😿</div>
            <h3 class="text-lg font-medium text-purple-200">No experiments found</h3>
            <p class="text-sm text-purple-300/60 mt-1">Try adjusting your search query or category filter.</p>
        </div>
    </main>

    <!-- Add/Edit Modal (Admin Only) -->
    <div id="expModal" class="fixed inset-0 bg-[#1e1b2e]/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="neumorphic-card rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-5 border-b border-purple-900/40 flex items-center justify-between bg-[#27223b]">
                <h3 id="modalTitle" class="font-semibold text-white text-base">Add New Experiment</h3>
                <button id="closeModalBtn" type="button" class="text-purple-300 hover:text-white w-8 h-8 rounded-xl neumorphic-inset flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="expForm" class="p-6 space-y-4">
                <input type="hidden" id="expId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-purple-300 mb-1.5">Experiment Title</label>
                        <input type="text" id="expTitle" required placeholder="e.g., Write a program to implement stack using arrays." class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 focus:outline-none focus:border-emerald-400">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-purple-300 mb-1.5">Language / Category</label>
                        <select id="expCategory" class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 focus:outline-none focus:border-emerald-400">
                            <option value="Java" class="bg-[#1e1b2e]">Java</option>
                            <option value="DSA" class="bg-[#1e1b2e]">DSA</option>
                            <option value="Python" class="bg-[#1e1b2e]">Python</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-purple-300 mb-1.5">Topic / Subtitle Tag</label>
                    <input type="text" id="expDesc" required placeholder="e.g., Operators, Arithmetic Promotion, Method Calling" class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 focus:outline-none focus:border-emerald-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-purple-300 mb-1.5">Source Code</label>
                    <textarea id="expCode" rows="8" required placeholder="Paste your code here..." class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 font-mono focus:outline-none focus:border-emerald-400 custom-scrollbar"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-purple-300 mb-1.5">Output / Execution Result</label>
                    <textarea id="expOutput" rows="3" placeholder="Paste terminal output..." class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 font-mono focus:outline-none focus:border-emerald-400 custom-scrollbar"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-3">
                    <button id="cancelModalBtn" type="button" class="px-5 py-2.5 rounded-xl text-sm text-purple-300 hover:text-white neumorphic-inset transition-colors cursor-pointer">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 shadow-lg shadow-emerald-400/20 transition-all cursor-pointer">Save Experiment</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 neumorphic-card text-purple-100 px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <div class="w-8 h-8 rounded-xl bg-emerald-400/10 text-emerald-400 flex items-center justify-center text-sm">
            <i class="fa-solid fa-check"></i>
        </div>
        <div class="text-sm font-medium" id="toastMsg">Copied Successfully! 😼</div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-purple-900/40 bg-[#1e1b2e] py-8 text-center text-xs text-purple-400/60 mt-auto space-y-1">
        <p>OOPs Manual &bull; Laboratory Code Repository 🐈</p>
    </footer>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjd3umg3pVKhT2lSeqOPcuo5pa8AfM7Pc",
            authDomain: "oopsexp.firebaseapp.com",
            projectId: "oopsexp",
            storageBucket: "oopsexp.firebasestorage.app",
            messagingSenderId: "299122521880",
            appId: "1:299122521880:web:96bff4a8a95ed97d6d906d",
            measurementId: "G-JRMVNJ3CSF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let experiments = [];
        let currentCategory = 'All';
        let isAdmin = false;
        let openExpId = null; // Tracks which experiment tab is currently expanded

        const ADMIN_EMAIL = "aryanveer5344@gmail.com";

        // Auth Button Listener
        document.getElementById('authBtn').addEventListener('click', async () => {
            if (isAdmin) {
                await signOut(auth);
            } else {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error("Auth error:", error);
                    alert("Authentication failed: " + error.message);
                }
            }
        });

        // Modal Controls
        function openModal(id = null) {
            if (!isAdmin) return;
            const modal = document.getElementById('expModal');
            const title = document.getElementById('modalTitle');
            document.getElementById('expForm').reset();
            document.getElementById('expId').value = '';
            
            if (id) {
                title.innerText = "Edit Experiment";
                const exp = experiments.find(e => e.id === id);
                if (exp) {
                    document.getElementById('expId').value = exp.id;
                    document.getElementById('expTitle').value = exp.title;
                    document.getElementById('expCategory').value = exp.category;
                    document.getElementById('expDesc').value = exp.description;
                    document.getElementById('expCode').value = exp.code;
                    document.getElementById('expOutput').value = exp.output || '';
                }
            } else {
                title.innerText = "Add New Experiment";
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('expModal').classList.add('hidden');
        }

        document.getElementById('addExpBtn').addEventListener('click', () => openModal());
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

        // Category Filter Listeners
        document.getElementById('categoryFilters').addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;
            currentCategory = btn.getAttribute('data-cat');
            document.querySelectorAll('.cat-btn').forEach(b => {
                if (b.getAttribute('data-cat') === currentCategory) {
                    b.className = "cat-btn active px-4 py-2 rounded-2xl text-xs font-bold bg-emerald-400 text-slate-950 transition-all shadow-lg shadow-emerald-400/20 cursor-pointer";
                } else {
                    b.className = "cat-btn px-4 py-2 rounded-2xl text-xs font-semibold neumorphic-btn text-purple-300 hover:text-white transition-all cursor-pointer";
                }
            });
            renderExperiments();
        });

        // Delegated Click Listener for Opening Tabs, Copying Code, Editing, and Deleting
        document.getElementById('experimentsList').addEventListener('click', async (e) => {
            // 1. Copy Button
            const copyBtn = e.target.closest('.copy-action-btn');
            if (copyBtn) {
                e.stopPropagation();
                const expId = copyBtn.getAttribute('data-id');
                const exp = experiments.find(item => item.id === expId);
                const textToCopy = exp ? exp.code : '';

                if (!textToCopy) return;

                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(textToCopy);
                    } else {
                        fallbackCopy(textToCopy);
                    }
                    showCopySuccess(copyBtn);
                } catch (err) {
                    fallbackCopy(textToCopy);
                    showCopySuccess(copyBtn);
                }
                return;
            }

            // 2. Edit Button
            const editBtn = e.target.closest('.edit-action-btn');
            if (editBtn) {
                e.stopPropagation();
                openModal(editBtn.getAttribute('data-id'));
                return;
            }

            // 3. Delete Button
            const deleteBtn = e.target.closest('.delete-action-btn');
            if (deleteBtn) {
                e.stopPropagation();
                const id = deleteBtn.getAttribute('data-id');
                if (isAdmin && confirm("Are you sure you want to delete this experiment?")) {
                    try {
                        await deleteDoc(doc(db, "experiments", id));
                        if (openExpId === id) openExpId = null;
                        fetchExperiments();
                    } catch (error) {
                        alert("Error deleting experiment.");
                    }
                }
                return;
            }

            // 4. Toggle Open/Close Experiment Tab when clicking the row header
            const tabHeader = e.target.closest('.exp-tab-header');
            if (tabHeader) {
                const expId = tabHeader.getAttribute('data-id');
                openExpId = (openExpId === expId) ? null : expId;
                renderExperiments();
            }
        });

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
        }

        function showCopySuccess(btn) {
            showToast("Copied Successfully! 😼");
            const originalHTML = '<i class="fa-regular fa-copy text-emerald-400"></i><span>Copy Code</span>';
            btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i><span class="text-emerald-400 font-bold">Copied!</span>';
            setTimeout(() => {
                btn.innerHTML = originalHTML;
            }, 2000);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Form Submit
        document.getElementById('expForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin) return;

            const id = document.getElementById('expId').value;
            const data = {
                title: document.getElementById('expTitle').value,
                category: document.getElementById('expCategory').value,
                description: document.getElementById('expDesc').value,
                code: document.getElementById('expCode').value,
                output: document.getElementById('expOutput').value,
                updatedAt: serverTimestamp()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "experiments", id), data);
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, "experiments"), data);
                }
                closeModal();
                fetchExperiments();
                showToast("Experiment saved successfully! 🚀");
            } catch (error) {
                alert("Error saving experiment: " + error.message);
            }
        });

        async function fetchExperiments() {
            try {
                const q = query(collection(db, "experiments"), orderBy("createdAt", "asc"));
                const querySnapshot = await getDocs(q);
                experiments = [];
                querySnapshot.forEach((docSnap) => {
                    experiments.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderExperiments();
            } catch (e) {
                console.error("Error fetching experiments:", e);
            }
        }

        function renderExperiments() {
            const list = document.getElementById('experimentsList');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = experiments.filter(exp => {
                const matchesCat = currentCategory === 'All' || exp.category === currentCategory;
                const matchesSearch = (exp.title || '').toLowerCase().includes(searchVal) || 
                                      (exp.description || '').toLowerCase().includes(searchVal) || 
                                      (exp.code || '').toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            list.innerHTML = '';
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            filtered.forEach((exp, idx) => {
                const expNumber = String(idx + 1).padStart(2, '0');
                const isOpen = (openExpId === exp.id);

                const card = document.createElement('div');
                card.className = "neumorphic-card rounded-3xl overflow-hidden transition-all duration-300";

                const badgeColor = exp.category === 'Java' ? 'text-emerald-300' :
                                   exp.category === 'DSA' ? 'text-cyan-300' : 'text-amber-300';

                let adminButtonsHTML = '';
                if (isAdmin) {
                    adminButtonsHTML = `
                        <button type="button" data-id="${exp.id}" title="Edit" class="edit-action-btn w-9 h-9 rounded-full neumorphic-btn flex items-center justify-center text-purple-300 hover:text-emerald-400 transition-colors cursor-pointer">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button type="button" data-id="${exp.id}" title="Delete" class="delete-action-btn w-9 h-9 rounded-full neumorphic-btn flex items-center justify-center text-purple-300 hover:text-rose-400 transition-colors cursor-pointer">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    `;
                }

                card.innerHTML = `
                    <!-- Horizontal Clickable Tab Row (Matches Reference Screenshot) -->
                    <div data-id="${exp.id}" class="exp-tab-header p-5 sm:px-7 sm:py-6 flex items-center justify-between gap-4 cursor-pointer select-none group">
                        
                        <div class="flex items-center gap-4 sm:gap-6 min-w-0">
                            <!-- Left Inset EXP Number Box -->
                            <div class="neumorphic-inset w-14 h-14 sm:w-16 sm:h-16 rounded-2xl flex flex-col items-center justify-center flex-shrink-0">
                                <span class="text-[10px] font-bold uppercase tracking-widest text-purple-400">EXP</span>
                                <span class="text-lg sm:text-xl font-extrabold text-emerald-400 leading-tight">${expNumber}</span>
                            </div>

                            <!-- Center Pills & Bold Program Title -->
                            <div class="min-w-0">
                                <div class="flex flex-wrap items-center gap-2.5 mb-1.5">
                                    <span class="neumorphic-inset px-3 py-1 rounded-full text-xs font-bold ${badgeColor}">
                                        ${escapeHtml(exp.category)}
                                    </span>
                                    ${exp.description ? `
                                    <span class="text-xs font-bold text-amber-400 flex items-center gap-1">
                                        <i class="fa-solid fa-star text-[10px]"></i>
                                        <span>${escapeHtml(exp.description)}</span>
                                    </span>` : ''}
                                </div>
                                <h3 class="font-bold text-white text-base sm:text-lg tracking-tight group-hover:text-emerald-300 transition-colors truncate sm:whitespace-normal">
                                    ${escapeHtml(exp.title)}
                                </h3>
                            </div>
                        </div>

                        <!-- Right Action Area & Circular Arrow Button -->
                        <div class="flex items-center space-x-2.5 flex-shrink-0">
                            ${adminButtonsHTML}
                            <div class="w-10 h-10 rounded-full neumorphic-btn flex items-center justify-center text-purple-200 group-hover:text-emerald-400 transition-transform duration-300 ${isOpen ? 'rotate-90 text-emerald-400' : ''}">
                                <i class="fa-solid fa-chevron-right text-sm"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Expandable Code & Output Drawer -->
                    <div class="${isOpen ? 'block' : 'hidden'} px-5 pb-6 sm:px-7 sm:pb-7 pt-2 border-t border-purple-900/30 space-y-4">
                        <div class="neumorphic-inset rounded-2xl p-4 sm:p-5 relative">
                            <div class="flex items-center justify-between pb-3 mb-3 border-b border-purple-900/40">
                                <div class="flex items-center space-x-2">
                                    <span class="w-3 h-3 rounded-full bg-rose-500/80"></span>
                                    <span class="w-3 h-3 rounded-full bg-amber-400/80"></span>
                                    <span class="w-3 h-3 rounded-full bg-emerald-400/80"></span>
                                    <span class="text-xs font-mono text-purple-300/70 ml-2">Source Code</span>
                                </div>
                                <button type="button" data-id="${exp.id}" class="copy-action-btn neumorphic-btn text-purple-100 hover:text-emerald-300 text-xs font-semibold px-4 py-1.5 rounded-xl flex items-center space-x-2 transition-all cursor-pointer">
                                    <i class="fa-regular fa-copy text-emerald-400"></i>
                                    <span>Copy Code</span>
                                </button>
                            </div>
                            <pre class="overflow-x-auto custom-scrollbar"><code class="text-xs sm:text-sm text-purple-100 leading-relaxed">${escapeHtml(exp.code)}</code></pre>
                        </div>

                        ${exp.output ? `
                        <div class="neumorphic-inset rounded-2xl p-4 sm:p-5">
                            <div class="text-[11px] font-bold text-purple-300 uppercase tracking-wider mb-2.5 flex items-center justify-between">
                                <span class="flex items-center space-x-2">
                                    <i class="fa-solid fa-terminal text-emerald-400"></i>
                                    <span>Terminal Output Verification</span>
                                </span>
                                <span class="text-[10px] font-mono text-purple-400/60">STDOUT</span>
                            </div>
                            <pre class="bg-[#14121f] p-3.5 rounded-xl border border-purple-900/40 overflow-x-auto custom-scrollbar"><code class="text-xs sm:text-sm text-emerald-300">${escapeHtml(exp.output)}</code></pre>
                        </div>` : ''}
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.getElementById('searchInput').addEventListener('input', renderExperiments);

        onAuthStateChanged(auth, (user) => {
            const authBtnText = document.getElementById('authBtnText');
            const authBtn = document.getElementById('authBtn');
            const addNewContainer = document.getElementById('addNewContainer');

            if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                isAdmin = true;
                authBtnText.innerText = "Admin Online";
                authBtn.classList.add('text-emerald-300');
                addNewContainer.classList.remove('hidden');
            } else {
                if (user) {
                    signOut(auth);
                    alert("Unauthorized account. Only the admin can sign in.");
                }
                isAdmin = false;
                authBtnText.innerText = "Admin Sign In";
                authBtn.classList.remove('text-emerald-300');
                addNewContainer.classList.add('hidden');
            }
            renderExperiments();
        });

        fetchExperiments();
    </script>
</body>
</html>
