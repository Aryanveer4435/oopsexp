<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOPs Manual — Experiments Repository</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1e1b2e; color: #f3f0ff; }
        code, pre { font-family: 'Fira Code', monospace; }
        
        /* Lighter, highly visible Neumorphic Raised Card */
        .neumorphic-card {
            background: #27223b;
            box-shadow: 10px 10px 25px #14121f, -6px -6px 20px #3a3257, inset 1px 1px 0px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(167, 139, 250, 0.25);
        }
        
        /* Lighter Neumorphic Inset Fields & Pre blocks */
        .neumorphic-inset {
            background: #1e1b2e;
            box-shadow: inset 4px 4px 8px #12101b, inset -4px -4px 8px #2a2641;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        /* Dedicated Raised Copy Button style */
        .copy-action-btn {
            background: #27223b;
            box-shadow: 4px 4px 10px #12101b, -2px -2px 8px #3a3257;
            border: 1px solid rgba(167, 139, 250, 0.35);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e1b2e; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-400 selection:text-slate-950">

    <!-- Header Navbar -->
    <header class="border-b border-purple-900/40 bg-[#1e1b2e]/90 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center space-x-3 group">
                <div class="bg-gradient-to-tr from-emerald-400 to-teal-500 p-2.5 rounded-2xl text-slate-950 font-bold shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-code text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-emerald-300 via-teal-200 to-cyan-300 bg-clip-text text-transparent">OOPs Manual 🐈</span>
                    </div>
                    <p class="text-xs text-purple-300/70">Object-Oriented Programming Laboratory Library</p>
                </div>
            </a>

            <div class="flex items-center space-x-4">
                <!-- Search Bar -->
                <div class="relative hidden sm:block">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-purple-400">
                        <i class="fa-solid fa-search text-sm"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search experiments..." class="neumorphic-inset text-sm text-purple-100 pl-9 pr-4 py-2.5 rounded-xl focus:outline-none focus:border-emerald-400 w-64 transition-all placeholder-purple-400/50">
                </div>

                <!-- Admin Action Button -->
                <div id="adminActionContainer">
                    <button id="authBtn" type="button" class="neumorphic-inset hover:bg-[#27223b] text-purple-200 hover:text-white text-sm px-4 py-2.5 rounded-xl flex items-center space-x-2 transition-all cursor-pointer">
                        <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                        <span id="authBtnText">Admin Sign In</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Clean Heading Area -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-4 w-full">
        <div class="neumorphic-card rounded-3xl p-6 md:p-8 flex flex-col items-center justify-center text-center relative overflow-hidden">
            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">
                Object-Oriented Programming <span class="bg-gradient-to-r from-emerald-300 to-teal-300 bg-clip-text text-transparent">Lab Manual</span>
            </h2>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">
        
        <!-- Controls & Category Filters -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div id="categoryFilters" class="flex flex-wrap gap-2">
                <button type="button" data-cat="All" class="cat-btn active px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-400 text-slate-950 transition-all shadow-lg shadow-emerald-400/20 cursor-pointer">All Experiments</button>
                <button type="button" data-cat="Java" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium neumorphic-inset text-purple-300 hover:text-white transition-all cursor-pointer">Java</button>
                <button type="button" data-cat="DSA" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium neumorphic-inset text-purple-300 hover:text-white transition-all cursor-pointer">DSA</button>
                <button type="button" data-cat="Python" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium neumorphic-inset text-purple-300 hover:text-white transition-all cursor-pointer">Python</button>
            </div>

            <!-- Add New Experiment Button -->
            <div id="addNewContainer" class="hidden">
                <button id="addExpBtn" type="button" class="bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-bold text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-400/20 flex items-center space-x-2 transition-all cursor-pointer">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Experiment</span>
                </button>
            </div>
        </div>

        <!-- Experiments Grid -->
        <div id="experimentsGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Dynamic Cards Will Load Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="text-purple-400/50 text-6xl mb-4">😿</div>
            <h3 class="text-lg font-medium text-purple-200">No experiments found</h3>
            <p class="text-sm text-purple-300/60 mt-1">Try adjusting your search query or category filter.</p>
        </div>
    </main>

    <!-- Add/Edit Modal (Admin Only) -->
    <div id="expModal" class="fixed inset-0 bg-[#1e1b2e]/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="neumorphic-card rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-5 border-b border-purple-900/40 flex items-center justify-between bg-[#27223b]">
                <h3 id="modalTitle" class="font-semibold text-white text-base">Add New Experiment</h3>
                <button id="closeModalBtn" type="button" class="text-purple-300 hover:text-white w-8 h-8 rounded-xl neumorphic-inset flex items-center justify-center transition-colors cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="expForm" class="p-6 space-y-4">
                <input type="hidden" id="expId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-purple-300 mb-1.5">Experiment Title</label>
                        <input type="text" id="expTitle" required placeholder="e.g., Dynamic Method Dispatch" class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 focus:outline-none focus:border-emerald-400">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-purple-300 mb-1.5">Language / Category</label>
                        <select id="expCategory" class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 focus:outline-none focus:border-emerald-400">
                            <option value="Java" class="bg-[#1e1b2e]">Java</option>
                            <option value="DSA" class="bg-[#1e1b2e]">DSA</option>
                            <option value="Python" class="bg-[#1e1b2e]">Python</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-purple-300 mb-1.5">Description / Objective</label>
                    <textarea id="expDesc" rows="2" required placeholder="Brief explanation of the concept demonstrated..." class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 focus:outline-none focus:border-emerald-400 custom-scrollbar"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-purple-300 mb-1.5">Source Code</label>
                    <textarea id="expCode" rows="8" required placeholder="Paste your code here..." class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 font-mono focus:outline-none focus:border-emerald-400 custom-scrollbar"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-purple-300 mb-1.5">Output / Execution Result</label>
                    <textarea id="expOutput" rows="3" placeholder="Paste terminal output..." class="w-full neumorphic-inset rounded-xl px-4 py-2.5 text-sm text-purple-100 font-mono focus:outline-none focus:border-emerald-400 custom-scrollbar"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-3">
                    <button id="cancelModalBtn" type="button" class="px-5 py-2.5 rounded-xl text-sm text-purple-300 hover:text-white neumorphic-inset transition-colors cursor-pointer">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 shadow-lg shadow-emerald-400/20 transition-all cursor-pointer">Save Experiment</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 neumorphic-card text-purple-100 px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <div class="w-8 h-8 rounded-xl bg-emerald-400/10 text-emerald-400 flex items-center justify-center text-sm">
            <i class="fa-solid fa-check"></i>
        </div>
        <div class="text-sm font-medium" id="toastMsg">Copied Successfully! 😼</div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-purple-900/40 bg-[#1e1b2e] py-8 text-center text-xs text-purple-400/60 mt-auto space-y-1">
        <p>OOPs Manual &bull; Laboratory Code Repository 🐈</p>
    </footer>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjd3umg3pVKhT2lSeqOPcuo5pa8AfM7Pc",
            authDomain: "oopsexp.firebaseapp.com",
            projectId: "oopsexp",
            storageBucket: "oopsexp.firebasestorage.app",
            messagingSenderId: "299122521880",
            appId: "1:299122521880:web:96bff4a8a95ed97d6d906d",
            measurementId: "G-JRMVNJ3CSF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let experiments = [];
        let currentCategory = 'All';
        let isAdmin = false;

        const ADMIN_EMAIL = "aryanveer5344@gmail.com";

        // Auth Button Listener
        document.getElementById('authBtn').addEventListener('click', async () => {
            if (isAdmin) {
                await signOut(auth);
            } else {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error("Auth error:", error);
                    alert("Authentication failed: " + error.message);
                }
            }
        });

        // Modal Controls
        function openModal(id = null) {
            if (!isAdmin) return;
            const modal = document.getElementById('expModal');
            const title = document.getElementById('modalTitle');
            document.getElementById('expForm').reset();
            document.getElementById('expId').value = '';
            
            if (id) {
                title.innerText = "Edit Experiment";
                const exp = experiments.find(e => e.id === id);
                if (exp) {
                    document.getElementById('expId').value = exp.id;
                    document.getElementById('expTitle').value = exp.title;
                    document.getElementById('expCategory').value = exp.category;
                    document.getElementById('expDesc').value = exp.description;
                    document.getElementById('expCode').value = exp.code;
                    document.getElementById('expOutput').value = exp.output || '';
                }
            } else {
                title.innerText = "Add New Experiment";
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('expModal').classList.add('hidden');
        }

        document.getElementById('addExpBtn').addEventListener('click', () => openModal());
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

        // Category Filter Listeners
        document.getElementById('categoryFilters').addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;
            currentCategory = btn.getAttribute('data-cat');
            document.querySelectorAll('.cat-btn').forEach(b => {
                if (b.getAttribute('data-cat') === currentCategory) {
                    b.className = "cat-btn active px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-400 text-slate-950 transition-all shadow-lg shadow-emerald-400/20 cursor-pointer";
                } else {
                    b.className = "cat-btn px-4 py-2 rounded-xl text-sm font-medium neumorphic-inset text-purple-300 hover:text-white transition-all cursor-pointer";
                }
            });
            renderExperiments();
        });

        // Delegated Click Listener for Copy, Edit, and Delete buttons inside the grid
        document.getElementById('experimentsGrid').addEventListener('click', async (e) => {
            const copyBtn = e.target.closest('.copy-action-btn');
            if (copyBtn) {
                const expId = copyBtn.getAttribute('data-id');
                const exp = experiments.find(item => item.id === expId);
                const codeElement = copyBtn.closest('.code-container')?.querySelector('code');
                const textToCopy = exp ? exp.code : (codeElement ? codeElement.textContent : '');

                if (!textToCopy) return;

                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(textToCopy);
                    } else {
                        fallbackCopy(textToCopy);
                    }
                    showCopySuccess(copyBtn);
                } catch (err) {
                    fallbackCopy(textToCopy);
                    showCopySuccess(copyBtn);
                }
                return;
            }

            const editBtn = e.target.closest('.edit-action-btn');
            if (editBtn) {
                openModal(editBtn.getAttribute('data-id'));
                return;
            }

            const deleteBtn = e.target.closest('.delete-action-btn');
            if (deleteBtn) {
                const id = deleteBtn.getAttribute('data-id');
                if (isAdmin && confirm("Are you sure you want to delete this experiment?")) {
                    try {
                        await deleteDoc(doc(db, "experiments", id));
                        fetchExperiments();
                    } catch (error) {
                        alert("Error deleting experiment.");
                    }
                }
            }
        });

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
        }

        function showCopySuccess(btn) {
            showToast("Copied Successfully! 😼");
            const originalHTML = '<i class="fa-regular fa-copy text-emerald-400"></i><span>Copy</span>';
            btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i><span class="text-emerald-400 font-semibold">Copied!</span>';
            setTimeout(() => {
                btn.innerHTML = originalHTML;
            }, 2000);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Form Submit
        document.getElementById('expForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin) return;

            const id = document.getElementById('expId').value;
            const data = {
                title: document.getElementById('expTitle').value,
                category: document.getElementById('expCategory').value,
                description: document.getElementById('expDesc').value,
                code: document.getElementById('expCode').value,
                output: document.getElementById('expOutput').value,
                updatedAt: serverTimestamp()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "experiments", id), data);
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, "experiments"), data);
                }
                closeModal();
                fetchExperiments();
                showToast("Experiment saved successfully! 🚀");
            } catch (error) {
                alert("Error saving experiment: " + error.message);
            }
        });

        async function fetchExperiments() {
            try {
                const q = query(collection(db, "experiments"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                experiments = [];
                querySnapshot.forEach((docSnap) => {
                    experiments.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderExperiments();
            } catch (e) {
                console.error("Error fetching experiments:", e);
            }
        }

        function renderExperiments() {
            const grid = document.getElementById('experimentsGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = experiments.filter(exp => {
                const matchesCat = currentCategory === 'All' || exp.category === currentCategory;
                const matchesSearch = (exp.title || '').toLowerCase().includes(searchVal) || 
                                      (exp.description || '').toLowerCase().includes(searchVal) || 
                                      (exp.code || '').toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            grid.innerHTML = '';
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            filtered.forEach((exp, idx) => {
                const card = document.createElement('div');
                card.className = "neumorphic-card rounded-2xl overflow-hidden flex flex-col transition-all";
                
                const badgeColor = exp.category === 'Java' ? 'bg-amber-500/10 text-amber-300 border-amber-500/20' :
                                   exp.category === 'DSA' ? 'bg-blue-500/10 text-blue-300 border-blue-500/20' : 'bg-emerald-400/10 text-emerald-300 border-emerald-400/20';

                let adminButtonsHTML = '';
                if (isAdmin) {
                    adminButtonsHTML = `
                        <div class="flex items-center space-x-2">
                            <button type="button" data-id="${exp.id}" class="edit-action-btn text-purple-300 hover:text-emerald-400 text-xs px-2.5 py-1.5 rounded-lg neumorphic-inset transition-colors cursor-pointer"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" data-id="${exp.id}" class="delete-action-btn text-purple-300 hover:text-rose-400 text-xs px-2.5 py-1.5 rounded-lg neumorphic-inset transition-colors cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="p-5 border-b border-purple-950/40 flex items-start justify-between gap-4 bg-[#2f2847]/40">
                        <div>
                            <div class="flex items-center space-x-2 mb-2">
                                <span class="text-xs px-2.5 py-0.5 rounded-full border font-semibold ${badgeColor}">${escapeHtml(exp.category)}</span>
                                <span class="text-[11px] text-purple-300/60 font-mono">EXP-${String(experiments.length - idx).padStart(2, '0')}</span>
                            </div>
                            <h3 class="font-semibold text-white text-base tracking-tight">${escapeHtml(exp.title)}</h3>
                            <p class="text-xs text-purple-300/80 mt-1 leading-relaxed">${escapeHtml(exp.description)}</p>
                        </div>
                        ${adminButtonsHTML}
                    </div>
                    <div class="code-container relative neumorphic-inset p-4 m-4 rounded-xl flex-grow">
                        <div class="absolute top-3 right-3 flex items-center space-x-2 z-20">
                            <button type="button" data-id="${exp.id}" class="copy-action-btn hover:bg-[#342d4f] active:scale-95 text-purple-200 text-xs px-3.5 py-1.5 rounded-xl flex items-center space-x-1.5 transition-all cursor-pointer">
                                <i class="fa-regular fa-copy text-emerald-400"></i>
                                <span>Copy</span>
                            </button>
                        </div>
                        <pre class="overflow-x-auto custom-scrollbar pt-8 pb-2"><code class="text-xs text-purple-200 leading-relaxed">${escapeHtml(exp.code)}</code></pre>
                    </div>
                    ${exp.output ? `
                    <div class="mx-4 mb-4 p-4 neumorphic-inset rounded-xl">
                        <div class="text-[11px] font-semibold text-purple-300 uppercase tracking-wider mb-2 flex items-center space-x-1.5">
                            <i class="fa-solid fa-terminal text-emerald-400"></i>
                            <span>Terminal Output Verification</span>
                        </div>
                        <pre class="bg-[#14121f] p-3.5 rounded-xl border border-purple-900/40 overflow-x-auto custom-scrollbar shadow-inner"><code class="text-xs text-emerald-300">${escapeHtml(exp.output)}</code></pre>
                    </div>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.getElementById('searchInput').addEventListener('input', renderExperiments);

        onAuthStateChanged(auth, (user) => {
            const authBtnText = document.getElementById('authBtnText');
            const authBtn = document.getElementById('authBtn');
            const addNewContainer = document.getElementById('addNewContainer');

            if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                isAdmin = true;
                authBtnText.innerText = "Admin (Sign Out)";
                authBtn.classList.add('border-emerald-400/50', 'text-emerald-400', 'bg-emerald-400/10');
                addNewContainer.classList.remove('hidden');
            } else {
                if (user) {
                    signOut(auth);
                    alert("Unauthorized account. Only the admin can sign in.");
                }
                isAdmin = false;
                authBtnText.innerText = "Admin Sign In";
                authBtn.classList.remove('border-emerald-400/50', 'text-emerald-400', 'bg-emerald-400/10');
                addNewContainer.classList.add('hidden');
            }
            renderExperiments();
        });

        fetchExperiments();
    </script>
</body>
</html>
